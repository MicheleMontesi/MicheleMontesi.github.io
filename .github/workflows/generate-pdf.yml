name: Generate Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - 'cv-onepage.html'
      - '.github/workflows/generate-pdf.yml'
      - 'scripts/generate-pdf.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Google Chrome (if missing)
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Installing Google Chrome..."
            sudo apt-get update
            sudo apt-get install -y wget fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 libxss1 libxtst6
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -fy install
            rm -f google-chrome-stable_current_amd64.deb
          fi
          google-chrome --version

      - name: Generate PDF
        run: |
          chmod +x scripts/generate-pdf.sh
          ./scripts/generate-pdf.sh

      - name: Commit and push updated PDF
        run: |
          if git status --porcelain michele-montesi-resume.pdf | grep -q 'michele-montesi-resume.pdf'; then
            echo "Changes detected in resume PDF. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add michele-montesi-resume.pdf
            git commit -m "Auto-generate michele-montesi-resume.pdf from cv-onepage.html [skip ci]"
            git push
          else
            echo "Resume PDF is already up to date. No commit needed."
          fi
